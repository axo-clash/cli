name: CLI release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$REF_TYPE" == tag && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo 'Select a version tag, for example v1.0.0 or v1.0.0-rc.1.' >&2
            exit 1
          }

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
          - runner: macos-latest
            os: darwin
          - runner: windows-latest
            os: windows
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Test and vet on the host OS
        run: |
          go test -race -timeout 120s ./...
          go vet ./...
      - name: Check Bash installer
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          python3 scripts/test-install.py
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: Build x64 and ARM64 binaries
        env:
          GOOS: ${{ matrix.os }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          suffix=''
          if [[ "$GOOS" == windows ]]; then suffix='.exe'; fi
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/axo-clash_${GOOS}_${arch}${suffix}" .
          done
      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Create release with checksums and installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum axo-clash_* install.sh install.ps1 > checksums.txt)
          options=()
          if [[ "$VERSION" == *-* ]]; then options+=(--prerelease --latest=false); fi
          gh release create "$VERSION" dist/* --verify-tag --title "AXO Clash $VERSION" --generate-notes "${options[@]}"
